name: Fetch rankings

# Weekly Google positions and search volumes from DataForSEO for the keywords
# in seo/keywords.json, stored on the "stats" branch next to the analytics.
on:
  schedule:
    - cron: '45 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Shares the group with analytics.yml so both never push to "stats" at once.
concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query DataForSEO
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node scripts/fetch-rankings.mjs > /tmp/rankings.json
      - name: Commit snapshot to stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin stats >/dev/null; then
            git fetch origin stats
            git switch stats
          else
            git switch --orphan stats
          fi
          mkdir -p stats/rankings
          cp /tmp/rankings.json stats/rankings/latest.json
          cp /tmp/rankings.json "stats/rankings/$(date -u +%F).json"
          git add stats/rankings
          git commit -m "Rankings snapshot $(date -u +%F)" || exit 0
          git push origin stats
