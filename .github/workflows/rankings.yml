name: Fetch rankings

# Weekly Google positions, search volumes and AI Overview citations from DataForSEO
# for the keywords in seo/keywords.json, stored on the "stats" branch next to the
# analytics, plus the rows the analytics dashboard reads (stats/seo-dashboard/).
# Started every Monday at 5:47 Berlin time by the daily dashboard task (a Claude scheduled
# task), because GitHub's own cron started this run up to eight hours late. No cron here, so
# the paid DataForSEO queries do not run twice.
on:
  workflow_dispatch:

permissions:
  contents: write

# Shares the group with analytics.yml and ai-visibility.yml so they never push to "stats" at once.
concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Query DataForSEO
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          node scripts/fetch-rankings.mjs > /tmp/rankings.json
          cp scripts/seo-rows.mjs /tmp/seo-rows.mjs
      - name: Commit snapshot to stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin stats >/dev/null; then
            git fetch origin stats
            git switch stats
          else
            git switch --orphan stats
          fi
          mkdir -p stats/rankings
          cp /tmp/rankings.json stats/rankings/latest.json
          cp /tmp/rankings.json "stats/rankings/$(date -u +%F).json"
          node /tmp/seo-rows.mjs stats stats/seo-dashboard
          git add stats/rankings stats/seo-dashboard
          git commit -m "Rankings snapshot $(date -u +%F)" || exit 0
          git push origin stats
