name: Stale articles

# Monthly list of blog articles and masterclass chapters whose prices, Flex Credits,
# deadlines or release dates are due for a check, plus external links that answer 404
# (scripts/stale-articles.mjs).
# Keeps one open issue up to date instead of opening a new one each month.
# The monthly run is the Claude scheduled task "Monatliche Artikelprüfung" (3rd of each month);
# this workflow only runs when started by hand, so the two never report twice.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: List due articles
        run: node scripts/stale-articles.mjs --links > /tmp/stale.md
      - name: Create or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Artikel prüfen: Preise, Fristen und tote Links"
          if grep -q '^- \[ \]' /tmp/stale.md; then :; else
            echo "Nothing due."
            exit 0
          fi
          gh label create artikel-pruefen --color FBCA04 --description "Preise und Fristen in Artikeln prüfen" 2>/dev/null || true
          number=$(gh issue list --label artikel-pruefen --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/stale.md
          else
            gh issue create --title "$title" --label artikel-pruefen --assignee fkramer690 --body-file /tmp/stale.md
          fi
