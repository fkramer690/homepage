name: PageSpeed

# Monthly PageSpeed Insights check (Lighthouse scores, lab metrics and Core Web Vitals
# from real users) of key pages on www.fk-sd.de. Stored on the "stats" branch.
on:
  schedule:
    - cron: '30 2 3 * *'
  workflow_dispatch:

permissions:
  contents: write

# Shares the group with the other stats workflows so they never push to "stats" at once.
concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Query PageSpeed Insights
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          node scripts/fetch-pagespeed.mjs > /tmp/pagespeed.json
      - name: Commit snapshot to stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin stats >/dev/null; then
            git fetch origin stats
            git switch stats
          else
            git switch --orphan stats
          fi
          mkdir -p stats/pagespeed
          cp /tmp/pagespeed.json stats/pagespeed/latest.json
          cp /tmp/pagespeed.json "stats/pagespeed/$(date -u +%F).json"
          git add stats/pagespeed
          git commit -m "PageSpeed $(date -u +%F)" || exit 0
          git push origin stats
