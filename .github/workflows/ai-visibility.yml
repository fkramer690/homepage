name: AI visibility

# Check every second Monday whether ChatGPT, Claude, Gemini, Perplexity and Google AI Mode
# name or cite fk-sd.de for the questions in seo/ai-prompts.json (DataForSEO).
# Stored on the "stats" branch, plus the rows the analytics dashboard reads.
# Started every second Monday (every 14 days from 2026-11-09) at 5:47 Berlin time by the daily dashboard
# task (a Claude scheduled task), together with rankings.yml, so the result is in the
# dashboard by 7:30. No cron here, so the task is its only automatic start.
on:
  workflow_dispatch:

permissions:
  contents: write

# Shares the group with analytics.yml and rankings.yml so they never push to "stats" at once.
concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Query DataForSEO
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          node scripts/fetch-ai-visibility.mjs > /tmp/ai.json
          cp scripts/seo-rows.mjs /tmp/seo-rows.mjs
      - name: Commit snapshot to stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin stats >/dev/null; then
            git fetch origin stats
            git switch stats
          else
            git switch --orphan stats
          fi
          mkdir -p stats/ai
          cp /tmp/ai.json stats/ai/latest.json
          cp /tmp/ai.json "stats/ai/$(date -u +%F).json"
          node /tmp/seo-rows.mjs stats stats/seo-dashboard
          git add stats/ai stats/seo-dashboard
          git commit -m "AI visibility snapshot $(date -u +%F)" || exit 0
          git push origin stats
