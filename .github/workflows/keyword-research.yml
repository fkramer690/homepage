name: Keyword research

# Manual long-tail research for the seeds in seo/research-seeds.json (DataForSEO
# Labs keyword suggestions). The list is printed in the job log; nothing is stored.
on:
  workflow_dispatch:
    inputs:
      seeds_de:
        description: German seeds, comma-separated (replaces seo/research-seeds.json for this run)
        required: false
      seeds_en:
        description: English seeds, comma-separated
        required: false
      volumes_de:
        description: German candidate phrases for exact search volumes, comma-separated
        required: false
      volumes_en:
        description: English candidate phrases for exact search volumes, comma-separated
        required: false
      serp_de:
        description: German phrases whose top ten Google results are printed, comma-separated
        required: false
      serp_en:
        description: English phrases whose top ten Google results are printed, comma-separated
        required: false
      location_en:
        description: DataForSEO location code for English suggestions (default 2840, USA)
        required: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Query DataForSEO
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SEEDS_DE: ${{ inputs.seeds_de }}
          SEEDS_EN: ${{ inputs.seeds_en }}
          VOLUMES_DE: ${{ inputs.volumes_de }}
          VOLUMES_EN: ${{ inputs.volumes_en }}
          SERP_DE: ${{ inputs.serp_de }}
          SERP_EN: ${{ inputs.serp_en }}
          LOCATION_EN: ${{ inputs.location_en }}
        run: node scripts/keyword-research.mjs
