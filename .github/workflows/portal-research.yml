name: Portal research

# One-off freelancer portal market research (research/portal-research.mjs); runs on
# pushes to this research branch only and commits the result back to it.
on:
  push:
    branches: [claude/project-thread-mz1elj]
    paths: [research/portal-research.mjs, .github/workflows/portal-research.yml]

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query DataForSEO
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node research/portal-research.mjs > research/portals.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/portals.json
          git commit -m "Portal research result $(date -u +%F)"
          git push
